name: Cleanup Legacy Environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEAN to unset legacy provider env vars on Beamup'
        required: true
        type: string

permissions:
  contents: read

jobs:
  clean-beamup:
    name: Unset legacy Beamup provider env vars
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'CLEAN'
    steps:
      - name: Configure SSH
        env:
          BEAMUP_SSH_PRIVATE_KEY: ${{ secrets.BEAMUP_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$BEAMUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H a.baby-beamup.club >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Unset legacy provider variables
        run: |
          set -euo pipefail
          APP="a38b6dd4fcd1/unified-streams-docker"

          # Best-effort removal of optional enable-lists. These were not set by
          # the old CI, so ignore failures for keys that do not exist.
          for key in SA7_ENABLED_PROVIDERS NUVIO_ENABLED_SCRAPERS VEGA_ENABLED_PROVIDERS; do
            ssh -o StrictHostKeyChecking=no dokku@a.baby-beamup.club "config:unset --no-restart $APP $key" >/dev/null 2>&1 || true
          done

          # These three were set by the old Beamup deploy on every run.
          # Run this after the profile-based deploy has finished. The unset
          # restarts the app so the current release reads
          # config/instances/beamup.env and the instances.beamup policy.
          ssh -o StrictHostKeyChecking=no dokku@a.baby-beamup.club \
            "config:unset $APP SA7_DISABLED_PROVIDERS NUVIO_DISABLED_SCRAPERS VEGA_DISABLED_PROVIDERS"
          echo "Done. Beamup now uses config/instances/beamup.env and instances.beamup policy."
